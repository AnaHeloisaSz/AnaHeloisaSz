<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ana Heloisa - Estudante de Ciência de Dados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="55%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#2a1160"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="60" y="145" height="60" width="0">
        <animate attributeName="width" values="0;490;490;0" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect x="-40" y="-40" width="1280" height="340" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- linha de varredura -->
  <rect x="0" y="-4" width="1200" height="2" fill="#22d3ee" opacity="0.35">
    <animate attributeName="y" from="-4" to="264" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- rede de dados (lado direito) -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="850" y1="70" x2="1000" y2="110"/>
    <line x1="1000" y1="110" x2="1060" y2="60"/>
    <line x1="1000" y1="110" x2="960" y2="170"/>
    <line x1="960" y1="170" x2="900" y2="210"/>
    <line x1="960" y1="170" x2="1100" y2="190"/>
    <line x1="850" y1="70" x2="960" y2="170"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="850" cy="70" r="6" fill="#22d3ee"><animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="110" r="7" fill="#a78bfa"><animate attributeName="r" values="6;10;6" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="60" r="5" fill="#22d3ee"><animate attributeName="r" values="4;8;4" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="170" r="7" fill="#22d3ee"><animate attributeName="r" values="6;10;6" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="210" r="5" fill="#a78bfa"><animate attributeName="r" values="4;8;4" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="190" r="6" fill="#a78bfa"><animate attributeName="r" values="5;9;5" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- símbolos flutuando -->
  <g font-family="'Fira Code', Consolas, 'Courier New', monospace" fill="#7dd3fc" opacity="0.6">
    <text x="700" y="55" font-size="22">&lt;/&gt;
      <animate attributeName="y" values="55;42;55" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="1130" y="130" font-size="24">{ }
      <animate attributeName="y" values="130;118;130" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="740" y="230" font-size="18">0101
      <animate attributeName="y" values="230;218;230" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="1040" y="240" font-size="16">SELECT *
      <animate attributeName="y" values="240;230;240" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="150" font-size="16">df.head()
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- nome -->
  <text x="60" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" filter="url(#glow)">Ana Heloisa
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <rect x="62" y="124" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" from="0" to="340" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- subtítulo digitando -->
  <g clip-path="url(#typeclip)">
    <text x="60" y="182" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="26" fill="#22d3ee" textLength="485" lengthAdjust="spacingAndGlyphs">&gt; Estudante de Ciência de Dados</text>
  </g>
  <rect x="60" y="156" width="12" height="30" fill="#22d3ee">
    <animate attributeName="x" values="60;545;545;60" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- linha inferior -->
  <rect x="0" y="256" width="1200" height="4" fill="url(#accent)"/>
</svg>
